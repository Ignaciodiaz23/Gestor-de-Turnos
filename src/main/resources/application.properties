spring.application.name=turnos-odontologia
server.port=8080

# Conexión a SQL Server (el contenedor "sqlserver" de OrbStack/Docker)
# Antes de arrancar hay que crear la base: CREATE DATABASE TurnosDB;
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=TurnosDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=TuClave_123

# Hibernate crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Muestra en consola el SQL que genera Hibernate (útil para aprender)
spring.jpa.show-sql=true

# Carga datos de prueba (paciente "Pepito" y tratamientos) si las tablas están vacías
app.datos-ejemplo=true
